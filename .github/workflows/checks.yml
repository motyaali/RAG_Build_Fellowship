name: Weeks 1-4 checks
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --locked
      - run: uv run python scripts/verify_setup.py --offline
      - run: uv run python scripts/ingest.py --dry-run
      - run: uv run pytest
      - run: uv run ruff check .
      - run: uv run ruff format --check .
